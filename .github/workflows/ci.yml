name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: aseo_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aseo_test
      TEST_DATABASE_APP_URL: postgresql+psycopg://aseo_app:aseo_app_dev_password@localhost:5432/aseo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -f infra/db/init.sql
      - run: pip install -r apps/api/requirements-dev.txt
      - run: cd apps/api && ruff check aseo tests migrations
      - run: cd apps/api && python -m pytest --cov=aseo --cov-report=term-missing:skip-covered

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: cd apps/web && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
      - run: cd apps/web && npx tsc --noEmit
      - run: cd apps/web && npx next lint
      - run: cd apps/web && npx next build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: aseo }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aseo
      DATABASE_APP_URL: postgresql+psycopg://aseo_app:aseo_app_dev_password@localhost:5432/aseo
      CRAWLER_ALLOWED_PRIVATE_HOSTS: '["127.0.0.1:8481"]'
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -f infra/db/init.sql
      - run: pip install -r apps/api/requirements.txt
      - run: cd apps/api && alembic upgrade head
      - run: cd apps/web && npm ci && npx playwright install --with-deps chromium && npx next build
      - run: |
          python integrations/wordpress/fixture_server/server.py &
          (cd apps/api && uvicorn aseo.main:app --port 8400 &)
          (cd apps/web && npx next start -p 3400 &)
          sleep 10 && (cd apps/api && python -m aseo.seed)
      - run: cd apps/web && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

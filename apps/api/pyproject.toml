[project]
name = "lodestar-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["migrations/versions/0001_initial_schema.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["B008", "S101", "S311", "UP007", "UP040", "E501", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:warnings"
